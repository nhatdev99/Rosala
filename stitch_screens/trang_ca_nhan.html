<body class="bg-surface font-body text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-100/50 backdrop-blur-md">
<div class="flex justify-between items-center px-6 h-16 w-full max-w-md mx-auto">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-highest">
<img alt="User profile photo" data-alt="professional headshot of a smiling middle-aged man with short dark hair in a crisp blue shirt, studio lighting, clean background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDm4-HblavRwzMHKGcwIzT-GocjU1YKDcxidabcp8XeLhDzVBaE9iH6Cv6IV8-fiXfGFNYftvWJ_yMZ0kq-OyJgTBOTs29aN0qi1XWGYH01oqJFNjZaXwx5dBnBOz-4OYSYvgyvEZ6Tl6rDrNdpVPDnwLu4HmaJDg3N6eVtxIyf4u1J46soGMuncMyQtYCgFjm9qBf7sP59h5J1v5BaLjBDDrb309bGCz4OnTBHeJmqmObDvSCi85AeNhPNDSYEE6SKwdIe828eqX1X"/>
</div>
<h1 class="font-headline font-bold tracking-tight text-lg text-blue-700">PreciseAnchor</h1>
<button class="text-slate-500 hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="pt-24 px-6 max-w-md mx-auto space-y-10">
<!-- Profile Hero Section -->
<section class="flex flex-col items-center text-center space-y-4">
<div class="relative">
<div class="w-32 h-32 rounded-full border-4 border-surface-container-lowest shadow-xl overflow-hidden bg-primary-fixed">
<img class="w-full h-full object-cover" data-alt="close-up of a confident professional man in his 30s, natural daylight, soft focus background of a modern office" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9NBVlG_l23JnBTTWDNryAYcRPraPILs18zVRopeoJov80fQj6mRnYf0brEBmq35l3esTSCF_8bky6-3EuwHZiQ_4Yoedn9-D2SgCl6tqns7BMVkd8rKklXoH4j5n85XzN9_qd_Gzp_RyeI_frA0wqnh2tDDvGDB7iS7M5_V-Ow3zwGt-i3jsPImNBil6ToU26FASQ5ke8o9xO2qQ2zWLUkO1hhe7mJLJhN5oeMy7TJLyYnTC1D5r6lFKnyv4MfLaloFH0Qae6JhMW"/>
</div>
<div class="absolute bottom-1 right-1 bg-primary p-2 rounded-full text-white shadow-lg">
<span class="material-symbols-outlined text-sm" data-icon="edit" style="font-variation-settings: 'FILL' 1;">edit</span>
</div>
</div>
<div class="space-y-1">
<h2 class="font-headline text-2xl font-extrabold tracking-tight text-on-surface">John Doe</h2>
<p class="font-label text-sm font-medium text-on-surface-variant tracking-wide">Senior Developer</p>
</div>
</section>
<!-- Account Overview (Asymmetric Layout Hint) -->
<section class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-lowest p-5 rounded-xl flex flex-col justify-between h-32 border border-outline-variant/10">
<span class="material-symbols-outlined text-primary" data-icon="work_history">work_history</span>
<div>
<p class="text-[10px] font-label font-bold uppercase tracking-widest text-outline">Hours This Week</p>
<p class="font-headline text-2xl font-bold text-on-surface">38.5</p>
</div>
</div>
<div class="bg-primary-container p-5 rounded-xl flex flex-col justify-between h-32 text-on-primary-container shadow-lg shadow-primary/10">
<span class="material-symbols-outlined" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<div>
<p class="text-[10px] font-label font-bold uppercase tracking-widest opacity-80">Next Payroll</p>
<p class="font-headline text-2xl font-bold">Oct 25</p>
</div>
</div>
</section>
<!-- Settings List -->
<section class="space-y-2">
<h3 class="font-headline text-sm font-bold text-outline px-1 mb-4">Account Settings</h3>
<div class="bg-surface-container-low rounded-xl overflow-hidden">
<!-- Personal Information -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<span class="font-body font-medium text-on-surface">Personal Information</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Notification Settings -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="notifications_active">notifications_active</span>
</div>
<span class="font-body font-medium text-on-surface">Notification Settings</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Change Password -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<span class="font-body font-medium text-on-surface">Change Password</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Privacy Policy -->
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="shield">shield</span>
</div>
<span class="font-body font-medium text-on-surface">Privacy Policy</span>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Log Out -->
<button class="w-full flex items-center justify-between p-4 hover:bg-error-container/20 transition-colors text-left group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-lg bg-error-container/30 flex items-center justify-center text-error">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
</div>
<span class="font-body font-semibold text-error">Log Out</span>
</div>
<span class="material-symbols-outlined text-error/50" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</section>
<!-- Version Info -->
<footer class="text-center pb-8">
<p class="font-label text-[10px] text-outline uppercase tracking-widest">PreciseAnchor v2.4.0</p>
</footer>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-2 bg-white/70 backdrop-blur-xl bg-opacity-70 z-50 rounded-t-3xl shadow-[0_-8px_24px_rgba(25,28,35,0.06)]">

<a class="flex flex-col items-center justify-center text-slate-500 px-3 py-1.5 hover:text-blue-600 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="timer">timer</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Attendance</span>
</a>
<!-- Logs -->
<a class="flex flex-col items-center justify-center text-slate-500 px-3 py-1.5 hover:text-blue-600 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="calendar_month">calendar_month</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Logs</span>
</a>
<!-- Payroll -->
<a class="flex flex-col items-center justify-center text-slate-500 px-3 py-1.5 hover:text-blue-600 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Payroll</span>
</a>
<!-- Profile (Active) -->
<a class="flex flex-col items-center justify-center bg-blue-50 text-blue-700 rounded-2xl px-3 py-1.5 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-['Inter'] text-[11px] font-medium tracking-wide">Profile</span>
</a>
</nav>
